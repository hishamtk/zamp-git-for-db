name: gitdb

# api/web bind-mount source and run tsx watch / Vite HMR.
# Edit files on the host — no image rebuild. Rebuild only when
# package-lock.json or a Dockerfile changes.
# Frozen nginx/node images still live in api/Dockerfile and web/Dockerfile.

services:
  db:
    image: postgres:17
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: gitdb
      POSTGRES_USER: gitdb
      POSTGRES_DB: gitdb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - max_wal_size=8GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=100
      # log any lock wait over 200ms - the telemetry story depends on seeing these
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitdb -d gitdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://gitdb:gitdb@db:5432/gitdb
    working_dir: /app
    command: ["node", "infra/seed.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app/api
    command: ["npx", "tsx", "watch", "src/index.ts"]
    environment:
      DATABASE_URL: postgres://gitdb:gitdb@db:5432/gitdb
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_ENV: development
    volumes:
      - ./api/src:/app/api/src
      - ./api/tsconfig.json:/app/api/tsconfig.json
      - ./infra:/app/infra
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--workspace=web"]
    environment:
      API_ORIGIN: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
      HMR_CLIENT_PORT: ${WEB_PORT:-5173}
    volumes:
      - ./web/src:/app/web/src
      - ./web/index.html:/app/web/index.html
      - ./web/vite.config.ts:/app/web/vite.config.ts
      - ./web/tailwind.config.js:/app/web/tailwind.config.js
      - ./web/postcss.config.js:/app/web/postcss.config.js
      - ./web/tsconfig.json:/app/web/tsconfig.json
      - ./api/src:/app/api/src
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
